case.1.briefing.before=봉쇄가 풀리기 전 보안실의 CCTV를 회수하라. 조작된 대피 기록과 봉쇄 명령을 조사하고 증거의 원본·복사본과 탈출 경로를 선택한다.
case.1.briefing.after=야간 회수반에 보안실 CCTV를 확보하라는 지시가 내려왔다. 대피 명단에는 모두 빠져나갔다고 적혀 있지만, 현장 기록은 다른 이야기를 하고 있다. 영상과 출입 기록을 확인한 뒤 탈출 경로를 선택하자.
scene.1.content.before=무전 담당자: 봉쇄가 풀리기 전에 보안실의 CCTV 기록을 가져와.\n주인공: 대피 인원은 전부 빠져나간 겁니까?\n무전 담당자: 명단에는 그렇게 되어 있어. 복사본만 확보하고 돌아와.
scene.1.content.after=무전 담당자: 회수반, 들리나? 봉쇄가 풀리기 전에 보안실 CCTV 기록부터 확보해.\n회수반원: 대피 명단에 있는 사람들은 다 빠져나갔습니까?\n무전 담당자: 명단에는 전원 대피라고 돼 있어. 우선 영상만 복사해서 돌아와.
scene.2.content.before=봉쇄 표시 21:17 / 이상 징후 21:10 / 경보 발생 21:12. 발생 순서는 이상 징후, 경보, 봉쇄이다.
scene.2.content.after=상황판 표시 기록 / 봉쇄 21:17 / 이상 징후 21:10 / 경보 21:12. 실제 발생 순서: 이상 징후 → 경보 → 봉쇄.
scene.3.content.before=잠금 번호는 이상 징후, 경보, 봉쇄 순서로 각 표시 시각의 분 일의 자리를 이어 붙인 세 자리이다. 앞의 0도 입력한다.
scene.3.content.after=잠금 번호는 상황판 기록을 발생 순서대로 읽어 만든다. 각 표시 시각의 분 일의 자리만 이어 붙인다. 첫 숫자가 0이어도 그대로 입력한다.
scene.4.content.before=인원 명단의 마지막 세 이름이 지워져 있다. 펜 자국 아래에는 대피 완료가 아니라 출구 폐쇄라는 문장이 남아 있다.
scene.4.content.after=대피 명단 맨 끝에 있던 세 이름이 줄로 지워져 있다. 명단 아래에는 ‘전원 대피’ 확인 도장이 찍혀 있다. 도장 옆의 메모는 짧다. ‘출구가 먼저 잠겼다.’
scene.5.content.before=이 카메라의 시계는 실제 시각보다 2분 빠르다. 문제의 문이 닫힌 장면에 표시된 시각은 21:17이다.
scene.5.content.after=점검 결과: CCTV 시계는 실제 시각보다 2분 빠르다. 출입문이 잠기는 화면에 표시된 시각은 21:17이다.
scene.6.content.before=21:12 A13 경보 발령 / 21:13 D07 출입 차단 / 21:15 B42 출입 차단 / 21:16 C09 봉쇄 승인 / 21:17 E26 출입 차단. 여러 차단 명령 중 CCTV 장면의 실제 시각과 일치하는 코드를 찾는다.
scene.6.content.after=21:12 A13 경보 발령 / 21:13 D07 출입 차단 / 21:15 B42 출입 차단 / 21:16 C09 봉쇄 승인 / 21:17 E26 출입 차단. 차단 명령 중 실제 시각에 일치하는 코드를 찾는다.
scene.7.content.before=남은 전력 한도는 6이다. 안전한 탈출에는 화물 승강기와 복도 조명이 필요하다. 실험실 배기는 탈출에 필요하지 않다.
scene.7.content.after=비상 전력 한도는 6이다. 필수 장비: 화물 승강기, 복도 조명. 실험실 배기는 필요하지 않다.
scene.8.content.before=입력 자리 순서는 승강기 4, 조명 2, 배기 3이다. 켜짐은 1, 꺼짐은 0으로 입력한다. 장갑 두 손을 비워야 패널을 조작할 수 있다.
scene.8.content.after=회로별 전력 소모: 승강기 4, 조명 2, 배기 3. 입력 자리 순서: 승강기 → 조명 → 배기. 켜짐은 1, 꺼짐은 0으로 표시한다. 스위치를 조작하려면 양손이 비어 있어야 한다.
scene.9.content.before=작업자 녹음: 승인도 떨어지기 전에 문부터 잠갔어. 밖에서는 대피가 끝났다고 할 거야.\n주인공: 사고 순서가 보고서와 맞지 않는다.
scene.9.content.after=작업자 녹음: 아직 안에 사람이 있어. 승인도 안 났는데 문부터 잠가 버렸어.\n회수반원: 명단에는 다 나갔다고 했는데. CCTV 시각과 출입 기록을 맞춰 봐야겠어.
scene.10.content.before=CCTV 복사 기능은 화면만 추출한다. 시계 보정 이력과 원본 서명은 원본 장치에 남는다. 원본 장치는 두 손으로 들어야 하며 사다리를 오를 수 없다.
scene.10.content.after=영상 복사본에는 화면만 담긴다. 시계 보정 이력과 원본 서명은 녹화 장치에 남는다. 장치를 옮기려면 양손을 써야 하므로 사다리 대신 화물 승강기를 이용한다.
scene.11.content.before=무전 담당자: 사다리로 돌아와. 화면만 있어도 보고서는 쓸 수 있어.\n주인공: 원본 서명이 없으면 봉쇄 시각을 입증할 수 없습니다.\n무전 담당자: 선택은 네가 해.
scene.11.content.after=무전 담당자: 사다리 아래에서 대기 중이야. 장비를 들고는 못 내려오니 영상만 챙겨 와.\n회수반원: 영상만으로는 문이 잠긴 정확한 시각을 입증하기 어렵습니다.\n무전 담당자: 원본을 가져갈 거면 화물 승강기로 가. 하역장에서도 나갈 수 있어.
scene.12.content.before=무전 담당자: 전원이 돌아왔군. 무엇을 가져왔지?\n주인공: 그날 닫힌 문이 사고였는지 명령이었는지 확인할 기록입니다.
scene.12.content.after=무전 담당자: 승강기 전원이 돌아왔어. 지금이면 하역장으로 나올 수 있어.\n회수반원: 출입 기록을 대조했습니다. 문이 잠긴 시각이 공식 승인보다 앞섭니다.\n무전 담당자: 자세한 얘기는 밖에서 듣자. 경사로 쪽으로 나와.
puzzle.1.prompt.before=발생 순서에 따라 분의 일의 자리 세 자리를 입력한다.
puzzle.1.prompt.after=상황판을 발생 순서대로 읽어 잠금 번호 세 자리를 입력하자.
puzzle.1.hint_text.before=발생 순서로 21:10, 21:12, 21:17을 나열한다.
puzzle.1.hint_text.after=상황판에 적힌 발생 순서는 이상 징후(21:10), 경보(21:12), 봉쇄(21:17)다.
puzzle.1.solved_text.before=보안 기록함이 열린다. CCTV 원본은 두 손을 사용하고 복사본은 화면만 담는다.
puzzle.1.solved_text.after=기록함이 열렸다. CCTV 녹화 장치를 원본으로 가져가거나 영상만 복사할 수 있다.
puzzle.2.prompt.before=승강기 조명 배기 순서로 1 또는 0 세 자리를 입력한다.
puzzle.2.prompt.after=비상 전력 한도 안에서 필요한 회로만 켜자. 승강기, 조명, 배기 순서로 설정한다.
puzzle.2.hint_text.before=4 + 2는 6이다. 승강기와 조명을 켜면 배기를 켤 여유는 없다.
puzzle.2.hint_text.after=화물 승강기(4)와 복도 조명(2)을 켜면 전력 한도 6에 맞는다. 실험실 배기(3)까지 켜면 한도를 넘는다.
puzzle.2.solved_text.before=승강기 전원이 복구되었다. 이제 CCTV 시각과 출입 기록을 대조할 수 있다.
puzzle.2.solved_text.after=복도 조명이 켜지고 화물 승강기에 전원이 들어왔다. 통로 잠금을 풀려면 보안실에서 CCTV 시각과 출입 명령을 대조해야 한다.
puzzle.3.prompt.before=카메라 시각을 보정하여 해당 출입 차단 명령 코드를 입력한다.
puzzle.3.prompt.after=CCTV 시각을 실제 시각으로 바꾼 뒤, 그때의 출입 차단 명령 코드를 입력하자.
puzzle.3.hint_text.before=21:17에서 2분을 빼면 21:15이다. 같은 시각의 출입 차단 행을 찾는다.
puzzle.3.hint_text.after=CCTV에 표시된 21:17에서 시계 오차 2분을 빼면 실제 시각은 21:15다. 목록에서 그 시각에 실행된 출입 차단 명령을 찾는다.
puzzle.3.solved_text.before=문은 승인이 나기 1분 전에 닫혔다. 출입 로그 복사와 비상 탈출 통로가 해제되었다.
puzzle.3.solved_text.after=문이 잠긴 시각은 21:15, 봉쇄가 승인된 시각은 21:16이었다. 출입 로그를 복사할 수 있게 됐고, 두 탈출 경로의 잠금도 풀렸다.
evidence.1.evidence_note.before=복사본은 영상 화면만 포함한다. 원본은 시계 보정 이력과 원본 서명을 포함하여 봉쇄 시각을 입증한다.
evidence.1.evidence_note.after=복사본에는 영상만 담긴다. CCTV 녹화 장치 원본에는 시계 보정 이력과 원본 서명도 남아 있다. 원본을 들면 양손이 차서 사다리를 이용할 수 없다.
evidence.2.evidence_note.before=21:15 B42 차단과 21:16 C09 승인이 함께 기록되어 있다. 서버 고정 자료라 복사본만 회수할 수 있다.
evidence.2.evidence_note.after=서버 로그에는 21:15의 출입 차단(B42)과 21:16의 봉쇄 승인(C09)이 남아 있다. 서버에 보관된 자료라 복사본만 가져갈 수 있다.
ending.1.ending_text.before=영상은 회수되었지만 가져온 자료만으로는 차단 명령과 승인 시각의 관계를 입증하지 못했다. 보고서는 사고로 남았고 돌아오지 못한 사람들의 이름만 조사 수첩에 남는다.
ending.1.ending_text.after=CCTV 기록은 무사히 가져왔다. 하지만 확보한 자료만으로는 출입문을 잠근 시각과 공식 승인 시각을 대조할 수 없었다.\n공식 보고서는 바뀌지 않았다. 대피 명단에서 지워진 세 사람의 이름은 내 수첩에만 남았다.
ending.2.ending_text.before=CCTV 원본의 보정 이력과 출입 로그를 대조해 승인보다 먼저 문을 잠갔다는 사실을 입증했다. 회수반은 보고서를 수정하고 누락된 사람들의 이름을 공개한다.
ending.2.ending_text.after=CCTV 원본의 시계 보정 이력과 출입 로그를 대조했다. 문은 21:15에 잠겼고, 봉쇄 승인은 1분 뒤에 내려졌다.\n회수반은 대피 보고서를 정정했다. 대피하지 못한 세 사람의 이름도 공식 기록에 다시 올라갔다.
